# ===================================================================
# AuraPet - chạy backend bằng Docker
#   MariaDB trên cùng máy:  docker compose --profile local up -d --build
#   Supabase (cloud DB):    đặt SPRING_PROFILES_ACTIVE=supabase + SUPABASE_* trong .env
#                           rồi chạy: docker compose up -d --build aurapet-backend
# Mọi biến lấy từ file .env (xem .env.example)
# ===================================================================
services:
  aurapet-db:
    image: mariadb:11.4
    profiles: ["local"]
    container_name: aurapet-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: ${DB_NAME:-aurapetdb}
      MARIADB_USER: ${DB_USER:-aurapet}
      MARIADB_PASSWORD: ${DB_PASSWORD:-}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  aurapet-backend:
    build:
      context: ./backend
    container_name: aurapet-backend
    restart: unless-stopped
    depends_on:
      aurapet-db:
        condition: service_healthy
        required: false
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-aurapet-db}
      DISCOVERY_ENABLED: "false"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"

volumes:
  mariadb_data:
