# ===================================================================
# Profile Supabase (PostgreSQL Cloud) — bật bằng SPRING_PROFILES_ACTIVE=supabase
# ===================================================================
spring:
  datasource:
    # Transaction Pooler: jdbc:postgresql://aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
    url: ${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
    username: ${SUPABASE_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    hikari:
      pool-name: AuraPetSupabasePool
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      max-lifetime: 600000
      idle-timeout: 300000
      connection-timeout: 20000
      keepalive-time: 30000
  jpa:
    properties:
      hibernate:
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true
