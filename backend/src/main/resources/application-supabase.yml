# ===================================================================
# AuraPet Backend - Supabase Production Profile
# Kích hoạt bằng: --spring.profiles.active=supabase
# ===================================================================

spring:
  datasource:
    # URL kết nối Supabase Postgres:
    # Transaction Pooler (khuyên dùng): jdbc:postgresql://aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
    # Direct Connection:                jdbc:postgresql://db.[PROJECT-REF].supabase.co:5432/postgres?sslmode=require
    url: ${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}}
    username: ${SUPABASE_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    hikari:
      pool-name: AuraPetSupabaseHikariPool
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      max-lifetime: 600000        # 10 phút, phù hợp với Supabase Transaction Pooler (PgBouncer)
      idle-timeout: 300000        # 5 phút
      connection-timeout: 20000   # 20 giây chờ kết nối
      keepalive-time: 30000       # 30 giây gửi heartbeat giữ kết nối sống
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true

aurapet:
  cors:
    # Cho phép GitHub Pages và các domain frontend
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*,http://localhost:*}
