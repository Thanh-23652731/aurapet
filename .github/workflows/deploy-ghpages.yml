name: Deploy Web to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - 'backend/src/main/resources/static/**'
      - '.github/workflows/deploy-ghpages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: ./mobile
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Bundle Standalone AIoT Dashboard
        run: |
          mkdir -p mobile/build/web/dashboard
          cp backend/src/main/resources/static/index.html mobile/build/web/dashboard/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'mobile/build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
