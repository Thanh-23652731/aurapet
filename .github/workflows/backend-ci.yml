name: AuraPet Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Backend (Java 17 + Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit & Integration Tests
        run: |
          mvn --batch-mode clean test -f backend/pom.xml

      - name: Package Executable JAR
        run: |
          mvn --batch-mode package -DskipTests -f backend/pom.xml

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurapet-backend-jar
          path: backend/target/aurapet-backend-*.jar
          retention-days: 7
